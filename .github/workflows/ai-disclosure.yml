name: AI disclosure (ASL003) - reusable

# Reusable workflow. Callers should run on pull_request_target so fork PRs can
# be labeled. This workflow never checks out, builds, or runs PR code, and
# never passes PR-controlled text to a shell: all parsing happens in
# github-script, reading from the event payload or the API.

on:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ai-disclosure:
    name: ai-disclosure
    runs-on: ubuntu-latest
    steps:
      - name: Check AI disclosure and label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // BEGIN parse (extracted and unit-tested by test/ai-disclosure-parse.test.js)
            const POLICY_URL = 'https://allstarlink.org/ai/';
            const LABEL = 'ai-assisted';

            const BOXES = {
              none: /^no material ai involvement/i,
              material: /^material ai involvement/i,
              reviewed: /^i have reviewed every line/i,
              tested: /^i have built, run, and tested/i,
              license: /^to my knowledge, this contribution does not violate any license/i,
              secrets: /^this change contains no secrets/i,
            };
            const ATTESTATIONS = {
              reviewed: 'reviewed every line of the change',
              tested: 'built, run, and tested the change',
              license: 'no license, copyright, or third-party rights violation',
              secrets: 'no secrets, credentials, personal data, or non-public information',
            };

            function parseBody(body) {
              const result = { ok: false, errors: [], material: false, checked: {} };
              const text = (body || '').replace(/<!--[\s\S]*?-->/g, '');
              if (!text.trim()) {
                result.errors.push('The pull request description is empty. Use the pull request template.');
                return result;
              }
              for (const key of Object.keys(BOXES)) result.checked[key] = false;
              const seen = {};
              for (const line of text.split(/\r?\n/)) {
                const m = line.match(/^\s*[-*+]\s*\[\s*([xX])?\s*\]\s*(.*?)\s*$/);
                if (!m) continue;
                for (const [key, re] of Object.entries(BOXES)) {
                  if (re.test(m[2])) {
                    seen[key] = true;
                    if (m[1]) result.checked[key] = true;
                  }
                }
              }
              const disclosure = [result.checked.none, result.checked.material].filter(Boolean).length;
              if (!seen.none || !seen.material) {
                result.errors.push('The AI Use Disclosure checkboxes are missing. Restore them from the pull request template.');
              } else if (disclosure !== 1) {
                result.errors.push(disclosure === 0
                  ? 'Check exactly one AI Use Disclosure box; neither is checked.'
                  : 'Check exactly one AI Use Disclosure box; both are checked.');
              }
              for (const [key, label] of Object.entries(ATTESTATIONS)) {
                if (!result.checked[key]) {
                  result.errors.push(seen[key]
                    ? `Contributor Attestation not checked: ${label}.`
                    : `Contributor Attestation is missing: ${label}. Restore it from the pull request template.`);
                }
              }
              result.material = result.checked.material;
              result.ok = result.errors.length === 0;
              return result;
            }

            function hasAssistedByTrailer(message) {
              return /^[ \t]*assisted-by:[ \t]*\S/im.test(message || '');
            }
            // END parse

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('This workflow must be called from a pull_request or pull_request_target event.');
              return;
            }

            const parsed = parseBody(pr.body);

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const trailerCommits = commits
              .filter((c) => hasAssistedByTrailer(c.commit.message))
              .map((c) => c.sha.slice(0, 7));

            const assisted = parsed.material || trailerCommits.length > 0;

            if (assisted) {
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name: LABEL, color: 'ededed',
                  description: 'Material AI involvement disclosed per ASL003',
                });
              } catch (err) {
                if (err.status !== 422) throw err;
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: [LABEL],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pr.number, name: LABEL,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            await core.summary
              .addHeading('AI disclosure (ASL003)', 2)
              .addList([
                `Disclosure and attestation: ${parsed.ok ? 'complete' : 'incomplete'}`,
                `Material AI involvement checked: ${parsed.material ? 'yes' : 'no'}`,
                `Commits scanned: ${commits.length}`,
                `Commits with an Assisted-by trailer: ${trailerCommits.length}` +
                  (trailerCommits.length ? ` (${trailerCommits.join(', ')})` : ''),
                `Label "${LABEL}": ${assisted ? 'applied' : 'not applied'}`,
              ])
              .addRaw(parsed.errors.length
                ? '\n**Problems:**\n\n' + parsed.errors.map((e) => `- ${e}`).join('\n') + '\n'
                : '')
              .write();

            if (!parsed.ok) {
              core.setFailed(
                'AI disclosure check failed:\n- ' + parsed.errors.join('\n- ') +
                `\n\nSee the AI Use Practice (ASL003): ${POLICY_URL}`
              );
            }
