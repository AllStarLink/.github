name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For support questions, please use the
        [community forum](https://community.allstarlink.org).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is getting in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: ai-use
    attributes:
      label: Did you use AI tools to write this report?
      options:
        - "No"
        - Yes, for wording or editing only
        - Yes, substantially
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have read the [AI Use Practice (ASL003)](https://allstarlink.org/ai/) and take responsibility for this report
          required: true
